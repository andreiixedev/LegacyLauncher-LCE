name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.package_version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get package version
        id: package_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Build Windows installer and zip
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: artifacts

      - name: Get release info
        id: release_info
        shell: bash
        run: |
          COMMIT_MSG=$(git log -1 --format=%s)
          COMMIT_AUTHOR=$(git log -1 --format=%an)
          COMMIT_DATE=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')

          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "commit_author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
          echo "commit_date=$COMMIT_DATE" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git tag ${{ needs.build-windows.outputs.version }}
          git push origin ${{ needs.build-windows.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release notes
        run: |
          cat > release_body.md <<EOF
          ## LegacyLauncher Release ${{ needs.build-windows.outputs.version }}

          ### 📦 Build Information
          - **Author:** ${{ steps.release_info.outputs.commit_author }}
          - **Date:** ${{ steps.release_info.outputs.commit_date }}

          ---

          ### 📝 Latest Commit
          > ${{ steps.release_info.outputs.commit_msg }}

          ---

          ### 📥 Downloads
          - `.exe` = installer version
          - `.zip` = portable/files version

          EOF

      - name: Create GitHub Release
        run: |
          gh release create ${{ needs.build-windows.outputs.version }} \
            artifacts/*.exe \
            artifacts/*.zip \
            --title "LegacyLauncher ${{ needs.build-windows.outputs.version }}" \
            --notes-file release_body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}